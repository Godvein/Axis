services:

  axis:
    image: godvein/axis:1.1
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AxisDB;User Id=sa;Password=MSSQLPassword123;TrustServerCertificate=True"
    depends_on:
      database-init:
        condition: service_completed_successfully

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "MSSQLPassword123"
    ports:
      - "1433:1433"
    healthcheck:
        test:
            [
                "CMD-SHELL",
                "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MSSQLPassword123' -C -Q 'SELECT 1' || exit 1"
            ]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s

  database-init:
    image: godvein/axis-db-init:1.1
    depends_on:
      sqlserver:
        condition: service_healthy